# Pruebas del kit (hooks, estado, kit pr, lanzadores) en los tres sistemas. Este flujo es del repositorio del kit;
# no se instala en los proyectos que usan el kit.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [20, 24]
        include:
          - os: ubuntu-latest
            node: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
