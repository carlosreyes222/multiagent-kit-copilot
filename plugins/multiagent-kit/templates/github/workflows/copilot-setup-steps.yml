# Entorno del cloud agent de GitHub Copilot (github.com → asignar un issue/HU a Copilot).
# El job DEBE llamarse copilot-setup-steps. Copilot lo ejecuta antes de empezar a trabajar para
# que las dependencias, Node y los hooks del kit estén disponibles en el sandbox.
# Ajusta los pasos de instalación a tu stack (Node, JDK/Android, .NET…).
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
  pull_request:
    paths: [".github/workflows/copilot-setup-steps.yml"]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node viene preinstalado en ubuntu-latest; los hooks y kit.js lo usan. Fija la versión si tu proyecto lo requiere.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # --- Dependencias del proyecto: descomenta / adapta ---
      # - uses: actions/setup-node@v4
      #   with: { node-version: "22", cache: "npm" }
      # - run: npm ci
      # - uses: actions/setup-java@v4
      #   with: { distribution: "temurin", java-version: "17" }
      # - uses: android-actions/setup-android@v3

      - name: Verificar archivos del kit
        run: |
          test -f pipeline.config.json && test -f kit.js && test -f .github/hooks/kit.json && node kit.js version
